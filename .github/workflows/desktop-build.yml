name: Desktop builds and tests

on:
  workflow_dispatch:
    inputs:
      require_macos_signing:
        description: Require signed and notarized macOS distribution
        type: boolean
        default: false
  pull_request:
  push:
    branches: ["master"]

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-14
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install build dependencies
        id: dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        id: unit
        run: python -m unittest discover -s tests -v
      - name: Source application smoke test
        id: source
        run: python -X utf8 main.py --self-test build/source-test.json
      - name: Configure macOS Developer ID signing
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEXTLAB_MACOS_SIGN_IDENTITY: ${{ vars.TEXTLAB_MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/configure_macos_signing.sh
      - name: Build native application
        id: build
        env:
          TEXTLAB_MACOS_SIGN_IDENTITY: ${{ vars.TEXTLAB_MACOS_SIGN_IDENTITY }}
        run: python -m PyInstaller packaging/ts_textlab.spec --clean --noconfirm
      - name: Test packaged application and archive
        id: packaged
        run: python scripts/check_distribution.py
      - name: Install Windows packaging tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Create and test desktop installer
        id: installer
        if: runner.os != 'Linux'
        env:
          TEXTLAB_MACOS_SIGN_IDENTITY: ${{ vars.TEXTLAB_MACOS_SIGN_IDENTITY }}
          REQUIRE_MACOS_SIGNING: ${{ inputs.require_macos_signing }}
        run: python scripts/create_desktop_installer.py
      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${TEXTLAB_NOTARY_KEYCHAIN:-}" ]; then
            security delete-keychain "$TEXTLAB_NOTARY_KEYCHAIN"
          fi
      - name: Upload application and test reports
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TS-TextLab-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            build/*test.json
          if-no-files-found: error
      - name: Save build result for SSH access
        if: always() && github.event_name != 'pull_request'
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_STATUS: ${{ job.status }}
          BUILD_STEPS: ${{ toJSON(steps) }}
        run: python scripts/publish_build_report.py

  release:
    name: Publish public download release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < version.txt)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download successful build artifacts
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare stable public download filenames
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-downloads

          copy_one() {
            local pattern="$1"
            local target="$2"
            local source
            source="$(find release-assets -type f -name "$pattern" -print -quit)"
            if [ -z "$source" ]; then
              echo "Missing release asset matching: $pattern" >&2
              exit 1
            fi
            cp "$source" "public-downloads/$target"
          }

          copy_one "TS-TextLab-$VERSION-windows-x86_64-Setup.exe" "TS-TextLab-windows-x86_64-Setup.exe"
          copy_one "TS-TextLab-$VERSION-windows-x86_64.exe" "TS-TextLab-windows-x86_64.exe"
          copy_one "TS-TextLab-$VERSION-macos-arm64*.dmg" "TS-TextLab-macos-arm64-unsigned.dmg"
          copy_one "TS-TextLab-$VERSION-linux-x86_64.tar.gz" "TS-TextLab-linux-x86_64.tar.gz"

          ls -lh public-downloads

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" public-downloads/* \
            --target "$GITHUB_SHA" \
            --title "TS TextLab $VERSION" \
            --generate-notes \
            --latest

      - name: Release already exists
        if: steps.existing.outputs.exists == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: echo "$TAG already exists; public release assets were left unchanged."
